# Builds and tests every push and pull request. A pushed tag vX.Y.Z also packs the Velopack release and publishes it as a
# GitHub Release, which is the update feed that SMAUpdater reads (UpdateCfg.CoreDefaultUpdateUrl), and deploys the
# plugin feed to GitHub Pages.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SuperMemoAssistant.slnx

      - name: Build
        run: dotnet build SuperMemoAssistant.slnx --no-restore -c Release

      # End-to-end tests need SuperMemo 20 and skip themselves without SMA_E2E=1.
      - name: Test
        run: dotnet test --solution SuperMemoAssistant.slnx --no-build -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Self-signed code signing (build/signing/sma-codesign.cer). Without the secrets, for example in a fork, the release
      # is unsigned. The certificate goes into the runner's store, so no password reaches a command line or the log.
      - name: Import signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SMA_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SMA_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Output 'No signing secrets: the release is unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sma-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Select-Object -First 1
          Remove-Item $pfx
          "SMA_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Pack
        shell: pwsh
        run: pwsh build/pack.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: Upload to GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet vpk upload github
          --repoUrl "${{ github.server_url }}/${{ github.repository }}"
          --token $env:GITHUB_TOKEN
          --outputDir artifacts/releases
          --channel win
          --tag $env:GITHUB_REF_NAME
          --releaseName "SuperMemo Assistant $env:GITHUB_REF_NAME"
          --publish

  # Publishes the plugin feed (NuGet v3 files and plugins.json) that "Browse plugins" reads (UpdateCfg.PluginsFeedBaseUrl).
  # Needs Settings > Pages > Source: GitHub Actions. Each deployment replaces the whole site.
  plugin-feed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - id: pages
        uses: actions/configure-pages@v6

      - name: Pack plugins
        shell: pwsh
        run: pwsh build/pack-plugins.ps1 -BaseUrl "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/feed

      - id: deploy
        uses: actions/deploy-pages@v5
